<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090b0f;--panel:#11141a;--panel2:#181c23;--line:rgba(255,255,255,.08);--text:#f5f7fb;--muted:#8f97a7;--accent:#7658f5;--mine:#7054df;--theirs:#20252e;--danger:#ff5d6c;--ok:#57d69a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 25px 80px #0007}.logo{font-size:42px;font-weight:900;letter-spacing:-.07em;text-align:center}.sub{text-align:center;color:var(--muted);margin:5px 0 26px}.label{font-size:12px;color:var(--muted);display:block;margin:13px 0 7px}input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;outline:0}input:focus{border-color:#8069f5}.btn{width:100%;padding:13px 15px;border-radius:14px;background:var(--accent);font-weight:800;margin-top:12px}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.error{min-height:18px;color:var(--danger);font-size:12px;margin-top:9px}.hint{color:var(--muted);font-size:12px;line-height:1.5;text-align:center;margin-top:17px}
.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.profilebar{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7658f5,#b08cff);display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.me{min-width:0;flex:1}.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:11px;color:var(--muted)}.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);font-size:18px}.search{padding:10px 12px}.rooms{overflow:auto;flex:1}.room{display:flex;gap:10px;padding:11px 13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.035)}.room:hover,.room.active{background:#1a1e26}.room .avatar{width:44px;height:44px}.roommain{min-width:0;flex:1}.roomtop{display:flex;gap:7px}.roomtop b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roomtime{font-size:10px;color:var(--muted)}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:var(--accent);font-size:10px;padding:2px 6px;border-radius:10px;align-self:center}.sideactions{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.sideactions button{flex:1;background:var(--panel2);padding:10px;border-radius:12px;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:68px;flex:none;border-bottom:1px solid var(--line);background:#11141aeF;display:flex;align-items:center;gap:10px;padding:9px 14px;backdrop-filter:blur(18px)}.back{display:none}.headinfo{min-width:0}.headinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:var(--ok)}.headactions{margin-left:auto;display:flex;gap:7px}.headactions button{background:var(--panel2);width:40px;height:40px;border-radius:12px}.messages{flex:1;overflow:auto;padding:18px max(14px,calc((100vw - 900px)/2));display:flex;flex-direction:column;gap:7px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:310px}.row{display:flex;position:relative}.row.mine{justify-content:flex-end}.bubble{position:relative;max-width:min(78%,600px);background:var(--theirs);border-radius:17px 17px 17px 5px;padding:9px 12px;word-break:break-word;white-space:pre-wrap}.mine .bubble{background:var(--mine);border-radius:17px 17px 5px 17px}.sender{font-size:11px;color:#c9c0ff;font-weight:800;margin-bottom:4px}.quoted{border-left:3px solid #a994ff;background:#0002;padding:6px 8px;margin-bottom:7px;border-radius:6px;font-size:11px;color:#ddd}.text.deleted{color:#b7bdc8;font-style:italic}.meta{font-size:9px;color:#ffffff88;text-align:right;margin-top:5px}.actions{position:absolute;right:-6px;top:-42px;display:none;background:#171a21;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 12px 30px #0009;z-index:4;white-space:nowrap}.row.mine .actions{right:0}.actions.open{display:flex}.actions button{background:transparent;padding:8px 9px;font-size:12px}.actions button:hover{background:#ffffff10;border-radius:8px}.msgmore{position:absolute;right:5px;top:5px;width:25px;height:25px;border-radius:8px;background:#0003;opacity:0;color:#fff}.bubble:hover .msgmore,.msgmore:focus{opacity:1}.mine .msgmore{right:5px}.composer{border-top:1px solid var(--line);padding:9px max(12px,calc((100vw - 900px)/2)) max(10px,env(safe-area-inset-bottom));background:#11141af5}.replybar{display:none;background:var(--panel2);border-radius:12px;padding:8px 10px;margin-bottom:7px;align-items:center;gap:8px}.replybar.show{display:flex}.replybar div{min-width:0;flex:1;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.replybar button{background:transparent;color:var(--muted);font-size:18px}.compose{display:flex;gap:8px}.compose input{border-radius:20px}.send{width:48px;height:48px;border-radius:50%;background:var(--accent);font-size:18px;flex:none}.typing{height:18px;padding:0 max(16px,calc((100vw - 900px)/2));font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.modal .card{max-height:90dvh;overflow:auto}.modal h2{margin:0 0 15px}.member{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.member .avatar{width:38px;height:38px}.membermain{flex:1;min-width:0}.membermain b{display:block}.membermain span{color:var(--muted);font-size:11px}.tag{font-size:10px;color:var(--muted);background:var(--panel2);padding:4px 7px;border-radius:8px}.danger{background:#35171d!important;color:#ff8994!important}.filelabel{display:block;background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:12px;text-align:center;margin-top:10px}.filelabel input{display:none}
@media(max-width:760px){.sidebar{width:100%}.main{position:fixed;inset:0;display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.back{display:block;width:38px;height:38px;border-radius:11px;background:var(--panel2);font-size:22px}.messages{padding:14px 10px}.bubble{max-width:88%}.headactions button.share{display:none}.actions{top:-44px}.profilebar{padding-top:max(10px,env(safe-area-inset-top))}}
@media(min-width:761px){.app{max-width:1200px;margin:auto;height:94dvh;margin-top:3dvh;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 100px #0009}.main{background:var(--bg)}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="card">
<div class="logo">TWO</div><div class="sub">private messenger</div>
<div id="authRegister"><label class="label">Имя</label><input id="firstName" maxlength="40" autocomplete="given-name"><label class="label">Фамилия</label><input id="lastName" maxlength="40" autocomplete="family-name"><label class="label">Nickname</label><input id="nickname" maxlength="30" autocomplete="username" placeholder="например, nikita"><label class="label">Email</label><input id="email" type="email" autocomplete="email"><label class="label">Пароль</label><input id="password" type="password" minlength="6" autocomplete="new-password"><button id="registerBtn" class="btn">Создать аккаунт</button><button id="showLogin" class="btn secondary">У меня уже есть аккаунт</button></div>
<div id="authLogin" class="hidden"><label class="label">Email</label><input id="loginEmail" type="email"><label class="label">Пароль</label><input id="loginPassword" type="password"><button id="loginBtn" class="btn">Войти</button><button id="showRegister" class="btn secondary">Создать аккаунт</button></div>
<div id="authError" class="error"></div><div class="hint">Без лишнего шума. Комнаты, сообщения и люди, с которыми вы действительно разговариваете.</div>
</div></section>
<section id="app" class="app hidden">
<aside class="sidebar"><div class="profilebar"><div id="myAvatar" class="avatar"></div><div class="me"><b id="myName">Пользователь</b><span id="myNick"></span></div><button id="profileBtn" class="iconbtn">⚙</button></div><div class="search"><input id="search" placeholder="Поиск чатов..."></div><div id="rooms" class="rooms"></div><div class="sideactions"><button id="newRoomBtn">＋ Комната</button><button id="joinBtn">🔑 Код</button></div></aside>
<main class="main"><header class="head"><button id="backBtn" class="back">‹</button><div id="roomAvatar" class="avatar">T</div><div class="headinfo"><b id="roomTitle">Выберите чат</b><span id="roomStatus" class="status">● offline</span></div><div class="headactions"><button id="membersBtn">👥</button><button id="shareBtn" class="share">↗</button></div></header><div id="typing" class="typing"></div><main id="messages" class="messages"><div class="empty">Выберите комнату слева.<br>Люди изобрели мессенджеры, чтобы потом годами писать «ок».</div></main><form id="composer" class="composer"><div id="replybar" class="replybar"><div id="replytext"></div><button id="cancelReply" type="button">×</button></div><div class="compose"><label class="filelabel" style="width:48px;padding:0;display:grid;place-items:center;margin:0;border-radius:50%;font-size:18px">＋<input id="fileInput" type="file"></label><input id="messageInput" maxlength="4000" placeholder="Сообщение..." autocomplete="off"><button id="sendBtn" class="send" type="submit">➤</button></div></form></main>
</section>
<div id="modal" class="modal"><div class="card"><div id="modalContent"></div><button id="modalClose" class="btn secondary">Закрыть</button></div></div>
<script>
const SUPABASE_URL='https://faiicfzxjyaidxaxibpq.supabase.co';
const SUPABASE_KEY='sb_publishable_OtjwAWPplFR1krP6h6EQqw_cUscBE4G';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);
let user=null,profile=null,currentRoom=null,currentChannel=null,roomsCache=[],lastMessages=new Map(),unread=new Map(),replyTo=null,typingTimer=null,typingSent=false,participants=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const displayName=p=>[p?.first_name,p?.last_name].filter(Boolean).join(' ')||p?.nickname||'Пользователь';
const initials=p=>([p?.first_name,p?.last_name].filter(Boolean).map(x=>x[0]).join('')||p?.nickname?.[0]||'T').toUpperCase();
const timeText=x=>new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(x));
function err(t){$('authError').textContent=t||''}function modal(html){$('modalContent').innerHTML=html;$('modal').classList.add('show')}
$('modalClose').onclick=()=>{$('modal').classList.remove('show');$('modalContent').innerHTML=''};
function avatarHTML(p,cls='avatar'){return p?.avatar_url?`<div class="${cls}"><img src="${esc(p.avatar_url)}"></div>`:`<div class="${cls}">${esc(initials(p))}</div>`}
async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;profile=data||{id:user.id};$('myName').textContent=displayName(profile);$('myNick').textContent=profile.nickname?'@'+profile.nickname:'';$('myAvatar').innerHTML=profile.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(initials(profile));}
async function ensureMember(room){const {data}=await db.from('chat_members').select('id').eq('room_id',room.id).eq('user_id',user.id).maybeSingle();return !!data}
async function loadRooms(){const {data,error}=await db.from('rooms').select('*').order('updated_at',{ascending:false,nullsFirst:false});if(error)throw error;const out=[];for(const r of data||[]){if(await ensureMember(r))out.push(r)}roomsCache=out;await loadPreviews();renderRooms()}
async function loadPreviews(){lastMessages.clear();for(const r of roomsCache.slice(0,50)){const {data}=await db.from('messages').select('message,created_at,sender_id,sender,deleted_at').eq('room_id',r.id).order('created_at',{ascending:false}).limit(1);if(data?.[0])lastMessages.set(r.id,data[0])}}
function renderRooms(){const q=$('search').value.trim().toLowerCase();$('rooms').innerHTML='';const list=roomsCache.filter(r=>((r.name||'')+' '+r.code).toLowerCase().includes(q)).sort((a,b)=>String(lastMessages.get(b.id)?.created_at||b.updated_at||'').localeCompare(String(lastMessages.get(a.id)?.created_at||a.updated_at||'')));if(!list.length){$('rooms').innerHTML='<div class="empty" style="padding:30px 15px">Комнат пока нет.</div>';return}for(const r of list){const lm=lastMessages.get(r.id);const el=document.createElement('div');el.className='room '+(currentRoom?.id===r.id?'active':'');el.innerHTML=`<div class="avatar">${r.type==='group'?'👥':'2'}</div><div class="roommain"><div class="roomtop"><b>${esc(r.name||'Комната '+r.code)}</b><span class="roomtime">${lm?timeText(lm.created_at):''}</span></div><div class="preview">${esc(lm?.deleted_at?'Сообщение удалено':lm?.message||'Нет сообщений')}</div></div>${unread.get(r.id)?`<span class="unread">${unread.get(r.id)}</span>`:''}`;el.onclick=()=>openRoom(r);$('rooms').appendChild(el)}}
async function openRoom(room){currentRoom=room;unread.delete(room.id);localStorage.setItem('two_current_room',room.id);$('app').classList.add('chat-open');$('roomTitle').textContent=room.name||'Комната '+room.code;$('roomAvatar').textContent=room.type==='group'?'👥':'2';await loadParticipants();await loadMessages();await subscribe();await markVisibleRead();renderRooms()}
async function loadParticipants(){const {data,error}=await db.rpc('get_room_participants',{p_room_id:currentRoom.id});if(!error)participants=data||[]}
function participant(id){return participants.find(p=>p.id===id)||null}
async function loadMessages(){const {data,error}=await db.from('messages').select('*').eq('room_id',currentRoom.id).order('created_at',{ascending:true});if(error){console.error(error);return}$('messages').innerHTML='';if(!data?.length){$('messages').innerHTML='<div class="empty">Здесь пока тихо.<br>Первое сообщение принадлежит тому, кто решится.</div>';return}for(const m of data)renderMessage(m);scroll()}
function renderMessage(m){if(document.querySelector(`[data-message-id="${CSS.escape(String(m.id))}"]`))return;$('messages').querySelector('.empty')?.remove();const mine=m.sender_id===user.id;const p=participant(m.sender_id);const row=document.createElement('div');row.className='row '+(mine?'mine':'theirs');row.dataset.messageId=m.id;const b=document.createElement('div');b.className='bubble';let quoted='';if(m.reply_to_id){quoted=`<div class="quoted">Ответ на сообщение</div>`}let text=m.deleted_at?'Сообщение удалено':m.message||'';b.innerHTML=(mine?'':`<div class="sender">${esc(displayName(p)||m.sender||'Пользователь')}</div>`)+quoted+`<div class="text ${m.deleted_at?'deleted':''}">${esc(text)}</div><div class="meta">${mine?'Вы':esc(m.sender||displayName(p))} · ${timeText(m.created_at)}${m.edited_at&&!m.deleted_at?' · изменено':''}</div>`;if(!m.deleted_at){const more=document.createElement('button');more.className='msgmore';more.textContent='⋮';more.onclick=e=>{e.stopPropagation();closeMenus();actions.classList.toggle('open')};b.appendChild(more);const actions=document.createElement('div');actions.className='actions';const add=(label,fn)=>{const x=document.createElement('button');x.textContent=label;x.onclick=e=>{e.stopPropagation();actions.classList.remove('open');fn()};actions.appendChild(x)};add('↩ Ответить',()=>startReply(m));add('Копировать',()=>navigator.clipboard?.writeText(m.message||''));if(mine){add('Изменить',()=>editMessage(m));add('Удалить',()=>deleteMessage(m))}b.appendChild(actions)}row.appendChild(b);$('messages').appendChild(row)}
function closeMenus(){document.querySelectorAll('.actions.open').forEach(x=>x.classList.remove('open'))}document.addEventListener('click',closeMenus);
function startReply(m){replyTo=m;$('replytext').textContent=(m.sender||'Сообщение')+': '+(m.message||'').slice(0,100);$('replybar').classList.add('show');$('messageInput').focus()}
$('cancelReply').onclick=()=>{replyTo=null;$('replybar').classList.remove('show')};
async function editMessage(m){const n=prompt('Изменить сообщение:',m.message||'');if(n===null||!n.trim()||n===m.message)return;const {error}=await db.from('messages').update({message:n.trim(),edited_at:new Date().toISOString()}).eq('id',m.id).eq('sender_id',user.id);if(error)alert(error.message);else await loadMessages()}
async function deleteMessage(m){if(!confirm('Удалить сообщение?'))return;const {error}=await db.from('messages').update({deleted_at:new Date().toISOString()}).eq('id',m.id).eq('sender_id',user.id);if(error)alert(error.message);else await loadMessages()}
function scroll(){requestAnimationFrame(()=>{$('messages').scrollTop=$('messages').scrollHeight})}
async function subscribe(){if(currentChannel)await db.removeChannel(currentChannel);currentChannel=db.channel('room-'+currentRoom.id).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'room_id=eq.'+currentRoom.id},async p=>{if(p.eventType==='INSERT'){renderMessage(p.new);if(p.new.sender_id!==user.id&&document.hidden)unread.set(currentRoom.id,(unread.get(currentRoom.id)||0)+1);lastMessages.set(currentRoom.id,p.new);scroll();await markRead(p.new.id)}else if(p.eventType==='UPDATE')await loadMessages()}).on('broadcast',{event:'typing'},({payload})=>{if(payload.user_id===user.id)return;$('typing').textContent=payload.typing?(payload.name+' печатает…'):' ';clearTimeout(typingTimer);if(payload.typing)typingTimer=setTimeout(()=>$('typing').textContent='',1600)}).subscribe(s=>$('roomStatus').textContent=s==='SUBSCRIBED'?'● online':'● подключение…')}
async function markRead(id){if(!id||!user)return;await db.from('message_reads').upsert({message_id:id,user_id:user.id,read_at:new Date().toISOString()},{onConflict:'message_id,user_id'})}
async function markVisibleRead(){const els=[...document.querySelectorAll('[data-message-id]')];for(const e of els)await markRead(e.dataset.messageId)}
function sendTyping(){if(!currentChannel||!currentRoom)return;currentChannel.send({type:'broadcast',event:'typing',payload:{user_id:user.id,name:displayName(profile),typing:true}});clearTimeout(window._typingStop);window._typingStop=setTimeout(()=>currentChannel?.send({type:'broadcast',event:'typing',payload:{user_id:user.id,typing:false}}),1200)}
$('messageInput').addEventListener('input',sendTyping);
$('composer').onsubmit=async e=>{e.preventDefault();if(!currentRoom)return;const txt=$('messageInput').value.trim();if(!txt)return;$('sendBtn').disabled=true;const payload={room_id:currentRoom.id,sender_id:user.id,sender:displayName(profile),message:txt};if(replyTo)payload.reply_to_id=replyTo.id;const {data,error}=await db.from('messages').insert(payload).select().single();$('sendBtn').disabled=false;if(error){alert(error.message);return}renderMessage(data);$('messageInput').value='';replyTo=null;$('replybar').classList.remove('show');scroll();}
$('backBtn').onclick=async()=>{$('app').classList.remove('chat-open');currentRoom=null;if(currentChannel)await db.removeChannel(currentChannel);renderRooms()};
$('search').oninput=renderRooms;
$('membersBtn').onclick=async()=>{await loadParticipants();modal(`<h2>Участники</h2>${participants.map(p=>`<div class="member">${avatarHTML(p)}<div class="membermain"><b>${esc(displayName(p))}</b><span>${p.nickname?'@'+esc(p.nickname):''}</span></div><span class="tag">${esc(p.role||'member')}</span></div>`).join('')}`)};
$('shareBtn').onclick=async()=>{if(!currentRoom)return;const link=location.origin+location.pathname+'?room='+encodeURIComponent(currentRoom.code);if(navigator.share){try{await navigator.share({title:'TWO',text:'Войди в нашу комнату',url:link})}catch(e){}}else await navigator.clipboard.writeText(link)};
$('profileBtn').onclick=()=>modal(`<h2>Профиль</h2><label class="label">Имя</label><input id="mFirst" value="${esc(profile.first_name||'')}"><label class="label">Фамилия</label><input id="mLast" value="${esc(profile.last_name||'')}"><label class="label">Nickname</label><input id="mNick" value="${esc(profile.nickname||'')}"><label class="filelabel">Загрузить фото<input id="mAvatar" type="file" accept="image/*"></label><button id="saveProfile" class="btn">Сохранить</button><button id="logout" class="btn danger">Выйти</button>`);setTimeout(()=>{$('saveProfile').onclick=saveProfile;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()}},0);
async function saveProfile(){const patch={first_name:$('mFirst').value.trim(),last_name:$('mLast').value.trim(),nickname:$('mNick').value.trim()||null,updated_at:new Date().toISOString()};const f=$('mAvatar').files[0];if(f){const path=user.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^\w.\-]/g,'_');const up=await db.storage.from('avatars').upload(path,f,{upsert:true});if(up.error){alert(up.error.message);return}patch.avatar_url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl}const {error}=await db.from('profiles').update(patch).eq('id',user.id);if(error){alert(error.message);return}await loadProfile();$('modal').classList.remove('show')}
$('newRoomBtn').onclick=()=>modal(`<h2>Новая комната</h2><label class="label">Название</label><input id="newRoomName" maxlength="60" placeholder="Например, Команда"><button id="createRoom" class="btn">Создать</button>`);setTimeout(()=>$('createRoom').onclick=createRoom,0);
async function createRoom(){const name=$('newRoomName').value.trim()||'Новая комната';const code=Array.from(crypto.getRandomValues(new Uint8Array(6))).map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');const {data,error}=await db.from('rooms').insert({name,code,type:'group',created_by:user.id}).select().single();if(error){alert(error.message);return}const cm=await db.from('chat_members').insert({room_id:data.id,user_id:user.id,role:'owner'});if(cm.error){alert(cm.error.message);return}$('modal').classList.remove('show');await loadRooms();await openRoom(data)}
$('joinBtn').onclick=()=>modal(`<h2>Войти по коду</h2><label class="label">Код комнаты</label><input id="joinCode" maxlength="6" style="text-transform:uppercase"><button id="doJoin" class="btn">Войти</button>`);setTimeout(()=>$('doJoin').onclick=joinByCode,0);
async function joinByCode(){const code=$('joinCode').value.trim().toUpperCase();const {data,error}=await db.rpc('join_room_by_code',{p_code:code});if(error){alert(error.message);return}$('modal').classList.remove('show');await loadRooms();await openRoom(data)}
$('fileInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!currentRoom)return;const path=currentRoom.id+'/'+user.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^\w.\-]/g,'_');const up=await db.storage.from('chat-media').upload(path,f);if(up.error){alert(up.error.message);return}const {data:pub}=db.storage.from('chat-media').getPublicUrl(path);const ins=await db.from('messages').insert({room_id:currentRoom.id,sender_id:user.id,sender:displayName(profile),message:'📎 '+f.name,attachment_url:pub.publicUrl,attachment_name:f.name,attachment_type:f.type,attachment_size:f.size}).select().single();if(ins.error)alert(ins.error.message);else renderMessage(ins.data)};
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){$('auth').classList.remove('hidden');return}user=session.user;try{await loadProfile();await loadRooms();$('auth').classList.add('hidden');$('app').classList.remove('hidden');const q=new URLSearchParams(location.search).get('room');if(q){const {data}=await db.from('rooms').select('*').eq('code',q.toUpperCase()).maybeSingle();if(data)await openRoom(data)}else{const saved=localStorage.getItem('two_current_room');const r=roomsCache.find(x=>x.id===saved);if(r)await openRoom(r)}}catch(e){console.error(e);err(e.message||'Ошибка запуска')}}
$('registerBtn').onclick=async()=>{err('');const first=$('firstName').value.trim(),last=$('lastName').value.trim(),nick=$('nickname').value.trim(),email=$('email').value.trim(),pass=$('password').value;if(!first||!email||!pass)return err('Заполните имя, email и пароль.');const {data,error}=await db.auth.signUp({email,password:pass,options:{data:{first_name:first,last_name:last,nickname:nick}}});if(error)return err(error.message);if(!data.session)return err('Аккаунт создан. Если подтверждение email включено в Supabase, подтвердите адрес и войдите.');user=data.user;await boot()};
$('loginBtn').onclick=async()=>{err('');const {data,error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)return err(error.message);user=data.user;await boot()};
$('showLogin').onclick=()=>{$('authRegister').classList.add('hidden');$('authLogin').classList.remove('hidden');err('')};$('showRegister').onclick=()=>{$('authLogin').classList.add('hidden');$('authRegister').classList.remove('hidden');err('')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentRoom)markVisibleRead()});boot();
</script></body></html>
