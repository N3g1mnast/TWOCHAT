<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>TWO — private chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #15171d;
      --panel2: #1c1f27;
      --text: #f5f7fb;
      --muted: #969cab;
      --accent: #7c5cff;
      --accent2: #6848ed;
      --mine: #7156e8;
      --theirs: #242832;
      --border: rgba(255,255,255,.08);
      --danger: #ff5d6c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .screen { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 28px; padding: 28px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .logo { font-size: 42px; font-weight: 800; letter-spacing: -.06em; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); margin: 6px 0 30px; }
    .label { display: block; color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    input { width: 100%; border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 15px; padding: 14px 15px; outline: none; }
    input:focus { border-color: rgba(124,92,255,.75); }
    .btn { width: 100%; margin-top: 12px; padding: 14px 16px; border-radius: 15px; color: white; background: var(--accent); font-weight: 700; }
    .btn:active { transform: scale(.99); }
    .btn.secondary { background: var(--panel2); border: 1px solid var(--border); }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 22px 0; font-size: 13px; }
    .divider:before, .divider:after { content: ""; height: 1px; flex: 1; background: var(--border); }
    .hint { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 18px; }
    .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
    .chat { width: 100%; min-height: 100dvh; display: none; flex-direction: column; background: var(--bg); }
    .chat-header { height: 72px; flex: 0 0 72px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: rgba(21,23,29,.92); backdrop-filter: blur(18px); }
    .back { width: 42px; height: 42px; border-radius: 50%; background: var(--panel2); color: var(--text); font-size: 22px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #a78bfa); font-weight: 800; }
    .head-title { font-weight: 750; }
    .head-status { color: #65d99b; font-size: 12px; margin-top: 2px; }
    .room-code { margin-left: auto; color: var(--muted); font-size: 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 20px max(16px, calc((100vw - 760px)/2)); display: flex; flex-direction: column; gap: 8px; }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 280px; }
    .bubble-row { display: flex; }
    .bubble-row.mine { justify-content: flex-end; }
    .bubble { max-width: min(78%, 560px); padding: 10px 13px; border-radius: 18px; background: var(--theirs); word-break: break-word; white-space: pre-wrap; }
    .mine .bubble { background: var(--mine); border-bottom-right-radius: 5px; }
    .theirs .bubble { border-bottom-left-radius: 5px; }
    .meta { color: rgba(255,255,255,.55); font-size: 10px; margin-top: 5px; }
    .composer { padding: 10px max(12px, calc((100vw - 760px)/2)) max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: rgba(21,23,29,.96); display: flex; gap: 8px; }
    .composer input { flex: 1; min-width: 0; border-radius: 20px; }
    .send { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; background: var(--accent); color: white; font-size: 20px; }
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.6); z-index: 5; }
    .modal .card { text-align: center; }
    .code { font-size: 36px; font-weight: 800; letter-spacing: .12em; margin: 18px 0; }
    .share-link { color: var(--muted); font-size: 12px; word-break: break-all; }
    @media (min-width: 700px) {
      .chat { max-width: 900px; min-height: 92dvh; margin: 4dvh auto; border: 1px solid var(--border); border-radius: 28px; overflow: hidden; box-shadow: 0 30px 100px rgba(0,0,0,.4); }
    }
    @media (min-width: 1000px) {
      body { background: #07080b; }
      .chat { max-width: 1100px; }
      .messages { padding-left: 100px; padding-right: 100px; }
      .composer { padding-left: 100px; padding-right: 100px; }
    }
  </style>
</head>
<body>
  <div id="startScreen" class="screen">
    <div class="card">
      <div class="logo">TWO</div>
      <div class="subtitle">Private chat for two</div>

      <label class="label" for="name">Ваше имя</label>
      <input id="name" maxlength="30" placeholder="Например, Никита" autocomplete="name" />
      <div id="startError" class="error"></div>

      <button id="createBtn" class="btn">Создать комнату</button>

      <div class="divider">или</div>

      <label class="label" for="code">Код комнаты</label>
      <input id="code" maxlength="6" placeholder="ABC123" autocomplete="off" />
      <button id="joinBtn" class="btn secondary">Войти в комнату</button>

      <div class="hint">Комната предназначена для двоих. Сейчас это MVP: доступ контролируется кодом комнаты.</div>
    </div>
  </div>

  <div id="chatScreen" class="chat">
    <header class="chat-header">
      <button id="backBtn" class="back" aria-label="Назад">‹</button>
      <div id="avatar" class="avatar">T</div>
      <div>
        <div class="head-title">TWO</div>
        <div id="status" class="head-status">● подключение...</div>
      </div>
      <div id="roomCodeLabel" class="room-code"></div>
    </header>

    <main id="messages" class="messages">
      <div id="empty" class="empty">Здесь пока тихо.<br>Кто-то должен написать первым. Человеческая традиция. 😎</div>
    </main>

    <form id="composer" class="composer">
      <input id="messageInput" maxlength="2000" placeholder="Сообщение..." autocomplete="off" />
      <button class="send" type="submit" aria-label="Отправить">➤</button>
    </form>
  </div>

  <div id="shareModal" class="modal">
    <div class="card">
      <div class="logo" style="font-size:30px">Комната создана</div>
      <div class="code" id="createdCode"></div>
      <div class="share-link" id="shareLink"></div>
      <button id="shareBtn" class="btn">Поделиться ссылкой</button>
      <button id="openBtn" class="btn secondary">Открыть чат</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://faiicfzxjyaidxaxibpq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OtjwAWPplFR1krP6h6EQqw_cUscBE4G";

  const { createClient } = window.supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentRoom = null;
  let currentName = "";
  let channel = null;

  const $ = (id) => document.getElementById(id);

  function getSavedName() {
    return localStorage.getItem("two_name") || "";
  }

  function setError(text) {
    $("startError").textContent = text || "";
  }

  function makeCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  function timeText(iso) {
    return new Intl.DateTimeFormat("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date(iso));
  }

  function addMessage(row) {
    const empty = $("empty");
    if (empty) empty.style.display = "none";

    if (document.querySelector('[data-message-id="' + row.id + '"]')) return;

    const mine = row.sender === currentName;
    const rowEl = document.createElement("div");
    rowEl.className = "bubble-row " + (mine ? "mine" : "theirs");
    rowEl.dataset.messageId = row.id;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const text = document.createElement("div");
    text.textContent = row.message;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (mine ? "Вы · " : row.sender + " · ") + timeText(row.created_at);

    bubble.appendChild(text);
    bubble.appendChild(meta);
    rowEl.appendChild(bubble);
    $("messages").appendChild(rowEl);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  async function loadMessages() {
    const { data, error } = await db
      .from("messages")
      .select("*")
      .eq("room_id", currentRoom.id)
      .order("created_at", { ascending: true });

    if (error) throw error;
    $("messages").innerHTML = "";
    if (!data.length) {
      $("messages").innerHTML = '<div id="empty" class="empty">Здесь пока тихо.<br>Кто-то должен написать первым. 😎</div>';
    } else {
      data.forEach(addMessage);
    }
  }

  async function connectRealtime() {
    if (channel) await db.removeChannel(channel);

    channel = db
      .channel("room-" + currentRoom.id)
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: "room_id=eq." + currentRoom.id
      }, payload => addMessage(payload.new))
      .subscribe(status => {
        if (status === "SUBSCRIBED") {
          $("status").textContent = "● online";
        } else {
          $("status").textContent = "● подключение...";
        }
      });
  }

  async function openChat(room) {
    currentRoom = room;
    localStorage.setItem("two_name", currentName);

    $("startScreen").style.display = "none";
    $("chatScreen").style.display = "flex";
    $("roomCodeLabel").textContent = room.code;
    $("avatar").textContent = currentName.trim().charAt(0).toUpperCase() || "T";

    await loadMessages();
    await connectRealtime();
    $("messageInput").focus();
  }

  async function createRoom() {
    setError("");
    currentName = $("name").value.trim();
    if (!currentName) return setError("Введите имя.");

    const code = makeCode();
    const { data, error } = await db
      .from("rooms")
      .insert({ code })
      .select()
      .single();

    if (error) return setError("Не удалось создать комнату: " + error.message);

    $("createdCode").textContent = data.code;
    $("shareLink").textContent = location.origin + location.pathname + "?room=" + data.code;
    $("shareModal").style.display = "flex";

    $("openBtn").onclick = async () => {
      $("shareModal").style.display = "none";
      await openChat(data);
    };

    $("shareBtn").onclick = async () => {
      const link = location.origin + location.pathname + "?room=" + data.code;
      if (navigator.share) {
        try { await navigator.share({ title: "TWO", text: "Войди в нашу приватную комнату", url: link }); }
        catch (_) {}
      } else {
        await navigator.clipboard.writeText(link);
        $("shareBtn").textContent = "Ссылка скопирована ✓";
      }
    };
  }

  async function joinRoom() {
    setError("");
    currentName = $("name").value.trim();
    const code = $("code").value.trim().toUpperCase();

    if (!currentName) return setError("Введите имя.");
    if (code.length !== 6) return setError("Код должен состоять из 6 символов.");

    const { data, error } = await db
      .from("rooms")
      .select("*")
      .eq("code", code)
      .maybeSingle();

    if (error) return setError("Ошибка: " + error.message);
    if (!data) return setError("Комната не найдена.");

    await openChat(data);
  }

  $("name").value = getSavedName();

  $("createBtn").addEventListener("click", createRoom);
  $("joinBtn").addEventListener("click", joinRoom);

  $("code").addEventListener("input", e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  });

  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = $("messageInput").value.trim();
    if (!message || !currentRoom) return;

    $("messageInput").disabled = true;

    const { data, error } = await db
      .from("messages")
      .insert({
        room_id: currentRoom.id,
        sender: currentName,
        message
      })
      .select()
      .single();

    $("messageInput").disabled = false;

    if (error) {
      alert("Не удалось отправить сообщение: " + error.message);
      return;
    }

    addMessage(data);
    $("messageInput").value = "";
    $("messageInput").focus();
  });

  $("backBtn").addEventListener("click", async () => {
    if (channel) await db.removeChannel(channel);
    currentRoom = null;
    $("chatScreen").style.display = "none";
    $("startScreen").style.display = "flex";
  });

  // Если открыли приглашение вида ?room=ABC123, подставляем код.
  const params = new URLSearchParams(location.search);
  const inviteCode = params.get("room");
  if (inviteCode) $("code").value = inviteCode.toUpperCase();

  // Enter в поле кода сразу выполняет вход.
  $("code").addEventListener("keydown", e => {
    if (e.key === "Enter") joinRoom();
  });
</script>
</body>
</html>
